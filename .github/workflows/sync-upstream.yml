name: Sync upstream main

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/totec448-spec/chat-on-steroids.git
          git fetch upstream main

      - name: Merge upstream without force pushing
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main

          if git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
          elif git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream/main."
          else
            git merge --no-edit upstream/main
          fi

          git push origin main
